name: release

# 이 워크플로 하나로 어디서든(휴대폰 브라우저 포함) 배포할 수 있습니다.
#   Actions 탭 → release → Run workflow → 버전 입력 → 실행
# 태그를 직접 밀어도(v3.1.0) 같은 흐름이 동작합니다.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "배포할 버전 (예: 3.1.0)"
        required: true
        type: string
      notes:
        description: "변경 내용 (선택)"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 버전 결정
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          V="${V#v}"
          if ! echo "$V" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "버전 형식이 올바르지 않습니다: $V (예: 3.1.0)"
            exit 1
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "배포 버전: $V"

      - name: 스크립트에 버전 기록
        env:
          V: ${{ steps.ver.outputs.value }}
        run: |
          python3 - <<'PY'
          import io, os, re
          version = os.environ["V"]
          path = "KakaoRoomScheduler.ps1"
          text = io.open(path, encoding="utf-8-sig").read()
          text, count = re.subn(
              r"(?m)^\$script:AppVersion\s*=\s*'[^']*'",
              "$script:AppVersion = '%s'" % version,
              text, count=1)
          if count != 1:
              raise SystemExit("AppVersion 줄을 찾지 못했습니다.")
          # PowerShell 5.1 이 한글을 바르게 읽으려면 UTF-8 BOM 이 필요합니다.
          io.open(path, "w", encoding="utf-8-sig").write(text)
          print("버전 기록 완료:", version)
          PY

      - name: 버전 커밋 및 태그
        if: github.event_name == 'workflow_dispatch'
        env:
          V: ${{ steps.ver.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KakaoRoomScheduler.ps1
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v$V"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          git tag -f "v$V"
          git push -f origin "v$V"

      - name: 배포 파일 만들기
        env:
          V: ${{ steps.ver.outputs.value }}
        run: |
          mkdir -p dist/KakaoRoomScheduler
          cp KakaoRoomScheduler.ps1 README.md dist/KakaoRoomScheduler/
          if [ -f 사용설명서.html ]; then cp 사용설명서.html dist/KakaoRoomScheduler/; fi
          # 실행 파일 이름은 바뀔 수 있으므로 있는 것을 모두 담습니다.
          shopt -s nullglob
          launchers=(*.cmd)
          if [ ${#launchers[@]} -eq 0 ]; then
            echo "실행용 .cmd 파일이 없습니다."
            exit 1
          fi
          cp "${launchers[@]}" dist/KakaoRoomScheduler/
          echo "담은 실행 파일: ${launchers[*]}"
          cd dist
          zip -r "../KakaoRoomScheduler-v$V.zip" KakaoRoomScheduler

      - name: 릴리스 등록
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.value }}
          NOTES: ${{ inputs.notes }}
        run: |
          BODY="${NOTES:-변경 내용이 기록되지 않았습니다.}"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "KakaoRoomScheduler-v$V.zip" --clobber
            gh release edit "v$V" --notes "$BODY" --latest
          else
            gh release create "v$V" "KakaoRoomScheduler-v$V.zip" --title "v$V" --notes "$BODY" --latest
          fi
          echo "배포 완료: v$V"
