name: release

# 이 워크플로 하나로 어디서든(휴대폰 브라우저 포함) 배포할 수 있습니다.
#   Actions 탭 → release → Run workflow → 버전 입력 → 실행
# 태그를 직접 밀어도(v3.1.0) 같은 흐름이 동작합니다.
#
# 윈도우에서 돌립니다. 프로그램(.exe)을 만들어야 하기 때문입니다.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "배포할 버전 (예: 3.1.0)"
        required: true
        type: string
      notes:
        description: "변경 내용 (선택)"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 버전 결정
        id: ver
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}"
          } else {
            $v = "${{ github.ref_name }}"
          }
          $v = $v -replace '^v', ''
          if ($v -notmatch '^[0-9]+(\.[0-9]+){1,3}$') {
            Write-Host "버전 형식이 올바르지 않습니다: $v (예: 3.1.0)"
            exit 1
          }
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "배포 버전: $v"

      - name: 스크립트에 버전 기록
        env:
          V: ${{ steps.ver.outputs.value }}
        run: |
          $path = 'KakaoRoomScheduler.ps1'
          # PowerShell 5.1 이 한글을 바르게 읽으려면 UTF-8 BOM 이 필요합니다.
          $enc = New-Object System.Text.UTF8Encoding($true)
          $text = [System.IO.File]::ReadAllText($path, $enc)
          $pattern = "(?m)^\`$script:AppVersion\s*=\s*'[^']*'"
          # .NET 치환에서 $ 는 특별한 뜻이 있으므로 $$ 로 적어 글자 그대로 넣습니다.
          $replacement = "`$`$script:AppVersion = '$env:V'"
          $count = ([regex]::Matches($text, $pattern)).Count
          if ($count -ne 1) { throw "AppVersion 줄을 찾지 못했습니다 ($count 건)" }
          $text = [regex]::Replace($text, $pattern, $replacement)
          [System.IO.File]::WriteAllText($path, $text, $enc)
          Write-Host "버전 기록 완료: $env:V"

      - name: 자체 점검
        run: |
          # 배포 전에 반드시 통과해야 합니다.
          powershell -NoProfile -ExecutionPolicy Bypass -STA -File .\KakaoRoomScheduler.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "자체 점검 실패" }
          Write-Host "자체 점검 통과"

      - name: 버전 커밋 및 태그
        if: github.event_name == 'workflow_dispatch'
        env:
          V: ${{ steps.ver.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KakaoRoomScheduler.ps1
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore(release): v$env:V"
            git push origin "HEAD:${{ github.ref_name }}"
          }
          git tag -f "v$env:V"
          git push -f origin "v$env:V"

      - name: 프로그램(.exe) 만들기
        env:
          V: ${{ steps.ver.outputs.value }}
        run: |
          # 스크립트를 그대로 담은 실행 파일을 만듭니다.
          # 이러면 다른 컴퓨터에서 실행 정책이나 파워셸을 몰라도 두 번 눌러 실행됩니다.
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name ps2exe -Scope CurrentUser -Force -AllowClobber
          Import-Module ps2exe
          $exe = '카카오 발송기.exe'
          $iconArg = @{}
          if (Test-Path 'app.ico') { $iconArg['iconFile'] = 'app.ico' }
          Invoke-PS2EXE -inputFile 'KakaoRoomScheduler.ps1' -outputFile $exe `
            -noConsole -STA -title '카카오 발송기' -product '카카오 발송기' `
            -description '카카오톡 채팅방 예약 발송기' -version $env:V @iconArg
          if (-not (Test-Path $exe)) { throw "프로그램을 만들지 못했습니다." }
          $kb = [Math]::Round((Get-Item $exe).Length / 1KB)
          Write-Host "프로그램 만듦: $exe ($kb KB)"

      - name: 설치 프로그램 만들기
        env:
          V: ${{ steps.ver.outputs.value }}
        run: |
          # Inno Setup 으로 설치 프로그램을 만듭니다.
          # 깃허브 윈도우 러너에는 대개 들어 있고, 없으면 받아서 씁니다.
          $iscc = ''
          foreach ($p in @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe")) {
            if (Test-Path $p) { $iscc = $p; break }
          }
          if (-not $iscc) {
            Write-Host "Inno Setup 을 설치합니다."
            choco install innosetup --no-progress -y
            foreach ($p in @(
                "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
                "$env:ProgramFiles\Inno Setup 6\ISCC.exe")) {
              if (Test-Path $p) { $iscc = $p; break }
            }
          }
          if (-not $iscc) { throw "Inno Setup 을 찾지 못했습니다." }
          & $iscc "/DAppVersion=$env:V" "/O." "/FKakaoSender-Setup-v$env:V" 'installer.iss'
          if ($LASTEXITCODE -ne 0) { throw "설치 프로그램을 만들지 못했습니다." }
          $setup = "KakaoSender-Setup-v$env:V.exe"
          if (-not (Test-Path $setup)) { throw "설치 프로그램 파일이 없습니다." }
          $kb = [Math]::Round((Get-Item $setup).Length / 1KB)
          Write-Host "설치 프로그램 만듦: $setup ($kb KB)"
      - name: 배포 파일 만들기
        env:
          V: ${{ steps.ver.outputs.value }}
        run: |
          $dist = 'dist/KakaoRoomScheduler'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item '카카오 발송기.exe' $dist -Force
          Copy-Item 'KakaoRoomScheduler.ps1', 'README.md' $dist -Force
          if (Test-Path 'app.ico') { Copy-Item 'app.ico' $dist -Force }
          # 필수 요소를 확인하고 없으면 설치해 주는 도구입니다.
          if (Test-Path 'prereq.ps1') { Copy-Item 'prereq.ps1' $dist -Force }
          if (Test-Path '사용설명서.html') { Copy-Item '사용설명서.html' $dist -Force }
          # 실행 파일 이름은 바뀔 수 있으므로 있는 것을 모두 담습니다.
          $launchers = @(Get-ChildItem -Filter '*.cmd' -File)
          if ($launchers.Count -gt 0) {
            Copy-Item $launchers.FullName $dist -Force
            Write-Host ("담은 실행 파일: " + ($launchers.Name -join ', '))
          }
          # 맥용 도구도 함께 담습니다.
          if (Test-Path 'mac') {
            New-Item -ItemType Directory -Path "$dist/mac" -Force | Out-Null
            Copy-Item 'mac/*' "$dist/mac" -Force
          }
          Compress-Archive -Path 'dist/KakaoRoomScheduler' -DestinationPath "KakaoRoomScheduler-v$env:V.zip" -Force
          Write-Host "묶음 파일 만듦"

      - name: 릴리스 등록
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.value }}
          NOTES: ${{ inputs.notes }}
        run: |
          $body = $env:NOTES
          if (-not $body) { $body = '변경 내용이 기록되지 않았습니다.' }
          $zip = "KakaoRoomScheduler-v$env:V.zip"
          # 깃허브는 한글 파일 이름을 default.exe 로 바꿔 버립니다.
          # 그래서 올릴 때만 영문 이름을 씁니다. 묶음 파일 안에는 한글 이름 그대로 들어 있습니다.
          $exe = "KakaoSender-v$env:V.exe"
          Copy-Item '카카오 발송기.exe' $exe -Force
          $setup = "KakaoSender-Setup-v$env:V.exe"
          $files = @($setup, $zip, $exe) | Where-Object { Test-Path $_ }
          gh release view "v$env:V" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v$env:V" @files --clobber
            gh release edit "v$env:V" --notes $body --latest
          } else {
            gh release create "v$env:V" @files --title "v$env:V" --notes $body --latest
          }
          Write-Host "배포 완료: v$env:V"
